<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioMed Research Assistant</title>
<style>
  :root {
    --bg: #f4f7f8;
    --panel: #ffffff;
    --ink: #14222b;
    --muted: #5b6b76;
    --line: #d9e0e4;
    --accent: #1f5fbf;
    --accent-soft: #e4edfb;
    --danger: #a4302a;
    --danger-soft: #fbeceb;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.5; }
  header { padding: 28px 32px 0; max-width: 1120px; margin: 0 auto; }
  h1 { font-family: var(--serif); font-size: 1.75rem; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); max-width: 60ch; }
  main { max-width: 1120px; margin: 24px auto 48px; padding: 0 32px; display: grid; grid-template-columns: 300px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 0 16px; } header { padding: 20px 16px 0; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  h2 { font-size: 0.95rem; margin: 0 0 12px; font-weight: 600; }

  .drop { display: block; border: 1.5px dashed var(--line); border-radius: 8px; padding: 20px 12px; text-align: center; cursor: pointer; color: var(--muted); font-size: 0.9rem; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over, .drop:focus-within { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop strong { display: block; color: var(--ink); margin-bottom: 2px; }

  #uploadMsg { min-height: 1.3em; margin: 10px 0 0; font-size: 0.85rem; color: var(--muted); }
  #uploadMsg.error { color: var(--danger); }

  ul.papers { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
  ul.papers li { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
  .paper-name { font-size: 0.88rem; font-weight: 600; word-break: break-word; }
  .paper-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 0.75rem; font-weight: 600; background: var(--accent-soft); color: var(--accent); margin-right: 6px; }
  .tag.none { background: #edf0f2; color: var(--muted); }
  .empty { color: var(--muted); font-size: 0.88rem; margin: 14px 0 0; }

  form.ask { display: grid; gap: 12px; }
  textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: inherit; color: var(--ink); background: #fff; }
  textarea:focus-visible, select:focus-visible, button:focus-visible, .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  select { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; background: #fff; color: var(--ink); }
  button.primary { margin-left: auto; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 20px; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary:hover { background: #194d9b; }
  button.primary:disabled { background: #9db7e0; cursor: progress; }

  #result { margin-top: 20px; display: grid; gap: 18px; }
  .answer { font-family: var(--serif); font-size: 1.08rem; line-height: 1.7; max-width: 68ch; white-space: pre-wrap; }
  .cite { font-family: var(--sans); font-size: 0.74rem; font-weight: 700; vertical-align: super; line-height: 0; border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 3px 5px; margin: 0 1px; cursor: pointer; }
  .cite:hover { background: var(--accent); color: #fff; }
  .error-box { background: var(--danger-soft); color: var(--danger); border-radius: 8px; padding: 12px 14px; font-size: 0.92rem; }

  .sources { display: grid; gap: 10px; }
  .source { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 14px; background: #fff; scroll-margin-top: 16px; }
  .source.flash { background: var(--accent-soft); }
  .source-head { font-size: 0.84rem; font-weight: 600; margin-bottom: 4px; }
  .source-head span { color: var(--muted); font-weight: 400; }
  .source p { margin: 0; font-size: 0.87rem; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>BioMed Research Assistant</h1>
  <p>Upload biomedical papers, then ask questions. Every answer cites the pages it came from.</p>
</header>

<main>
  <aside class="panel">
    <h2>Your papers</h2>
    <label class="drop" id="drop">
      <input type="file" id="file" accept="application/pdf,.pdf">
      <strong>Add a PDF</strong>
      Drop a file here or click to browse
    </label>
    <p id="uploadMsg" role="status"></p>
    <ul class="papers" id="papers"></ul>
    <p class="empty" id="papersEmpty">No papers yet. Add a PDF to get started.</p>
  </aside>

  <section>
    <div class="panel">
      <form class="ask" id="askForm">
        <label for="question" class="sr" style="position:absolute;left:-9999px">Your question</label>
        <textarea id="question" placeholder="Ask something about your papers, e.g. What is the main finding?" required minlength="3" maxlength="1000"></textarea>
        <div class="controls">
          <select id="topic" aria-label="Filter by topic"><option value="">All topics</option></select>
          <select id="k" aria-label="Number of passages">
            <option value="3">3 passages</option>
            <option value="4" selected>4 passages</option>
            <option value="6">6 passages</option>
          </select>
          <button class="primary" id="askBtn" type="submit">Ask</button>
        </div>
      </form>
    </div>
    <div id="result" aria-live="polite"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

function errorText(body, fallback) {
  if (!body || body.detail === undefined) return fallback;
  if (typeof body.detail === "string") return body.detail;
  try { return body.detail.map(d => d.msg).join("; "); } catch { return fallback; }
}

async function loadPapers() {
  const res = await fetch("/papers");
  const papers = await res.json();
  const list = $("papers");
  list.textContent = "";
  const names = Object.keys(papers);
  $("papersEmpty").style.display = names.length ? "none" : "block";

  const topics = new Set();
  names.forEach(name => {
    const p = papers[name];
    topics.add(p.topic);
    const li = document.createElement("li");
    const title = document.createElement("div");
    title.className = "paper-name";
    title.textContent = name;
    const meta = document.createElement("div");
    meta.className = "paper-meta";
    const tag = document.createElement("span");
    tag.className = "tag" + (p.topic === "Unclassified" ? " none" : "");
    tag.textContent = p.topic;
    meta.append(tag, `${p.pages} pages, ${p.chunks} passages`);
    li.append(title, meta);
    list.append(li);
  });

  const select = $("topic");
  const current = select.value;
  select.length = 1;
  [...topics].sort().forEach(t => select.add(new Option(t, t)));
  select.value = topics.has(current) ? current : "";
}

async function upload(file) {
  const msg = $("uploadMsg");
  msg.className = "";
  if (!file) return;
  if (!file.name.toLowerCase().endsWith(".pdf")) {
    msg.className = "error"; msg.textContent = "Only PDF files are supported."; return;
  }
  msg.textContent = `Reading ${file.name}... the first upload can take a moment.`;
  const form = new FormData();
  form.append("file", file);
  try {
    const res = await fetch("/ingest", { method: "POST", body: form });
    const body = await res.json().catch(() => null);
    if (!res.ok) throw new Error(errorText(body, "Upload failed."));
    msg.textContent = `Added ${body.source} (${body.topic}).`;
    await loadPapers();
  } catch (err) {
    msg.className = "error"; msg.textContent = err.message;
  }
}

$("file").addEventListener("change", (e) => { upload(e.target.files[0]); e.target.value = ""; });
const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => upload(e.dataTransfer.files[0]));

function renderAnswer(text) {
  const box = document.createElement("div");
  box.className = "answer";
  text.split(/(\[\d+\])/g).forEach(part => {
    const m = part.match(/^\[(\d+)\]$/);
    if (m) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "cite"; b.textContent = m[1];
      b.setAttribute("aria-label", `Jump to source ${m[1]}`);
      b.addEventListener("click", () => {
        const target = document.getElementById("source-" + m[1]);
        if (!target) return;
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.add("flash");
        setTimeout(() => target.classList.remove("flash"), 1200);
      });
      box.append(b);
    } else {
      box.append(document.createTextNode(part));
    }
  });
  return box;
}

function renderSources(sources) {
  const wrap = document.createElement("div");
  wrap.className = "sources";
  sources.forEach(s => {
    const card = document.createElement("div");
    card.className = "source"; card.id = "source-" + s.id;
    const head = document.createElement("div");
    head.className = "source-head";
    head.append(`[${s.id}] ${s.source}, page ${s.page} `);
    const sp = document.createElement("span");
    sp.textContent = s.topic;
    head.append(sp);
    const p = document.createElement("p");
    p.textContent = s.snippet + (s.snippet.length >= 200 ? "..." : "");
    card.append(head, p);
    wrap.append(card);
  });
  return wrap;
}

$("askForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const result = $("result"), btn = $("askBtn");
  const payload = { question: $("question").value.trim(), k: Number($("k").value) };
  if ($("topic").value) payload.topic = $("topic").value;
  btn.disabled = true; btn.textContent = "Thinking...";
  result.textContent = "";
  try {
    const res = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    const body = await res.json().catch(() => null);
    if (!res.ok) throw new Error(errorText(body, "Something went wrong."));
    result.append(renderAnswer(body.answer));
    if (body.sources.length) result.append(renderSources(body.sources));
  } catch (err) {
    const box = document.createElement("div");
    box.className = "error-box"; box.textContent = err.message;
    result.append(box);
  } finally {
    btn.disabled = false; btn.textContent = "Ask";
  }
});

loadPapers();
</script>
</body>
</html>
